# Written by `codegraph init`. Edit freely -- nothing regenerates this.
[project]
root = "."
db_path = ".codegraph/graph.db"

[index]
include = [
    "backend/",
    "frontend/src/",
    "tests/",
]
languages = ["python", "typescript"]
exclude = [
    "**/node_modules/**",
    "**/.venv/**",
    "**/venv/**",
    "**/__pycache__/**",
    "**/dist/**",
    "**/build/**",
    "**/*.min.js",
    "**/*.d.ts",
    "**/migrations/**",
    "**/alembic/versions/**",
    "**/.git/**",
    "**/.codegraph/**",
    "**/logs/**",
    "**/vendor/**",
]
max_file_size_kb = 512

[server]
max_results = 50
snippet_max_lines = 40

# Reconstructs the links the language cannot express -- HTTP routes for
# fastapi, hooks and template parts for wordpress.
[bridge]
enabled = true
backend_framework = "fastapi"
frontend_api_dir = "frontend/src/services/"

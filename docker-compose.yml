services:
  bot:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: anime_bot
    restart: always
    env_file:
      - .env
    ports:
      - "172.17.0.1:8001:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./backend/migrations:/app/backend/migrations

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_BOT_URL: ${MINIAPP_BOT_URL:-https://t.me/YOUR_BOT_USERNAME}
    container_name: anime_frontend
    restart: always
    ports:
      - "172.17.0.1:8002:80"
    depends_on:
      - bot

  db:
    image: postgres:15-alpine
    container_name: anime_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
#    ports:
#      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
